<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow"> <!-- keeps this page out of Google -->
<title>Guest list — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&family=Parisienne&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"> <!-- reuses your colours + fonts -->
<style>
  body{padding:32px 20px 80px}
  .wrap{max-width:1100px;margin:0 auto}
  h1{font-size:34px;margin-bottom:24px}
  .card{background:var(--card);border:1px solid rgba(34,53,39,.1);padding:28px}
  #login{max-width:380px;margin:12vh auto}
  #login input{width:100%;padding:13px 14px;border:1px solid rgba(34,53,39,.2);margin:14px 0;background:var(--cream)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
  .stat b{display:block;font-family:var(--font-display);font-size:40px;color:var(--forest);line-height:1}
  .stat span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--moss)}
  .bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .bar input,.bar select{padding:10px 12px;border:1px solid rgba(34,53,39,.2);background:var(--card)}
  .bar input{flex:1;min-width:180px}
  .bar .btn{padding:10px 20px}
  .tbl{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
  th{text-align:left;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--moss);padding:10px;border-bottom:1px solid var(--sage)}
  td{padding:12px 10px;border-bottom:1px solid rgba(34,53,39,.07);vertical-align:top}
  .yes{color:var(--moss)}.no{color:#a4472f}
  .msg{max-width:260px;color:var(--ink-soft)}
  .x{background:none;border:0;color:#a4472f;cursor:pointer;font-size:13px}
  #err{color:#a4472f;font-size:14px;min-height:20px}
</style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN: password is the ADMIN_PASSWORD environment variable you set in Vercel -->
  <div id="login" class="card">
    <h1 style="font-size:28px;margin:0">Guest list</h1>
    <input id="pw" type="password" placeholder="Admin password" autocomplete="current-password">
    <button class="btn btn-solid" id="go" style="width:100%">Sign in</button>
    <p id="err"></p>
  </div>

  <!-- DASHBOARD (shown after login) -->
  <div id="app" hidden>
    <h1>Guest list</h1>
    <div class="stats" id="stats"></div>
    <div class="card">
      <div class="bar">
        <input id="q" placeholder="Search name or email">
        <select id="f"><option value="all">Everyone</option><option value="yes">Attending</option><option value="no">Declined</option></select>
        <button class="btn" id="csv">Export CSV</button>
        <button class="btn" id="out">Sign out</button>
      </div>
      <div class="tbl"><table>
        <thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Guests</th><th>Dietary</th><th>Message</th><th>On wall</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let pw = sessionStorage.getItem('adminPw') || '', rows = [];

// Tiny DOM helper. We use textContent (never innerHTML) because guest names/messages are untrusted text.
const el = (tag, props = {}, kids = []) => { const e = Object.assign(document.createElement(tag), props); [].concat(kids).forEach(k => e.append(k)); return e; };

// Talks to /api/admin with the password in a header.
async function api(method, body){
  const r = await fetch('/api/admin', { method, headers: { 'x-admin-key': pw, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Something went wrong.');
  return j;
}

async function load(){
  try { rows = (await api('GET')).rsvps; sessionStorage.setItem('adminPw', pw); $('#login').hidden = true; $('#app').hidden = false; render(); }
  catch (e) { sessionStorage.removeItem('adminPw'); $('#login').hidden = false; $('#app').hidden = true; $('#err').textContent = pw ? e.message : ''; }
}

function render(){
  // --- top numbers ---
  const yes = rows.filter(r => r.attending), seats = yes.reduce((n, r) => n + r.guests, 0);
  $('#stats').replaceChildren(...[['Replies', rows.length], ['Attending', yes.length], ['Total guests', seats], ['Declined', rows.length - yes.length]]
    .map(([l, n]) => el('div', { className: 'card stat' }, [el('b', { textContent: n }), el('span', { textContent: l })])));

  // --- table (filtered by search box + dropdown) ---
  const q = $('#q').value.toLowerCase(), f = $('#f').value;
  const list = rows.filter(r => (f === 'all' || (f === 'yes') === r.attending) && (r.name + r.email).toLowerCase().includes(q));
  $('#rows').replaceChildren(...list.map(r => {
    const wish = r.message ? el('input', { type: 'checkbox', checked: r.show_wish, title: 'Show on the Well Wishes wall',
      onchange: async e => { try { await api('PATCH', { id: r.id, show_wish: e.target.checked }); r.show_wish = e.target.checked; } catch (x) { e.target.checked = !e.target.checked; alert(x.message); } } }) : '—';
    const del = el('button', { className: 'x', textContent: 'Delete', onclick: async () => {
      if (!confirm(`Delete ${r.name}'s RSVP?`)) return;
      try { await api('DELETE', { id: r.id }); rows = rows.filter(x => x.id !== r.id); render(); } catch (x) { alert(x.message); } } });
    return el('tr', {}, [
      el('td', { textContent: r.name }), el('td', { textContent: r.email }),
      el('td', { textContent: r.attending ? 'Attending' : 'Declined', className: r.attending ? 'yes' : 'no' }),
      el('td', { textContent: r.guests }), el('td', { textContent: r.dietary || '—' }),
      el('td', { textContent: r.message || '—', className: 'msg' }), el('td', {}, [wish]), el('td', {}, [del])]);
  }));
}

// CSV export. Cells starting with = + - @ get a leading ' so spreadsheets can't run them as formulas.
$('#csv').onclick = () => {
  const cell = v => { v = String(v ?? ''); if (/^[=+\-@]/.test(v)) v = "'" + v; return `"${v.replace(/"/g, '""')}"`; };
  const head = ['Name', 'Email', 'Attending', 'Guests', 'Dietary', 'Message', 'Submitted'];
  const body = rows.map(r => [r.name, r.email, r.attending ? 'Yes' : 'No', r.guests, r.dietary, r.message, r.updated_at].map(cell).join(','));
  const a = el('a', { href: URL.createObjectURL(new Blob([[head.join(','), ...body].join('\n')], { type: 'text/csv' })), download: 'guest-list.csv' });
  a.click(); URL.revokeObjectURL(a.href);
};

$('#go').onclick = () => { pw = $('#pw').value; load(); };
$('#pw').onkeydown = e => { if (e.key === 'Enter') $('#go').click(); };
$('#out').onclick = () => { sessionStorage.removeItem('adminPw'); pw = ''; location.reload(); };
$('#q').oninput = render; $('#f').onchange = render;
if (pw) load();
</script>
</body>
</html>
